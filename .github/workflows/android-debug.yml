name: Android debug APK
on:
  push:
    branches: [feature/capacitor]
  pull_request:
  workflow_dispatch:
concurrency:
  group: split-android-debug-signing
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 16111833
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
      - run: npm test
      - name: Select external debug identity path
        shell: bash
        run: echo "SPLIT_DEBUG_KEYSTORE=$RUNNER_TEMP/split-debug.keystore" >> "$GITHUB_ENV"
      - name: Retain CI debug signing identity for future updates
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/split-debug.keystore
          key: split-debug-signing-v1
      - name: Create debug identity only on first use
        shell: bash
        run: |
          if [ ! -f "$SPLIT_DEBUG_KEYSTORE" ]; then
            keytool -genkeypair -keystore "$SPLIT_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - run: npm run android:debug
      - name: Verify APK and record signing certificate
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk | tee android/app/build/outputs/apk/debug/debug-signing.txt
      - uses: actions/upload-artifact@v4
        with:
          name: split-android-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/debug-signing.txt
          if-no-files-found: error
          retention-days: 14
