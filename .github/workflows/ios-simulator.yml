name: iOS Simulator build
on:
  push:
    branches: [feature/capacitor]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [standard, compact]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - run: xcodebuild -version
      - run: npm ci
      - run: npm test
      - run: npm run cap:sync
      - name: Build unsigned iOS Simulator app (Swift Package Manager)
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Prepare visual UI test tooling
        run: gem install xcodeproj -v 1.27.0 --user-install --no-document
      - name: iPhone Simulator visual and interaction regression
        timeout-minutes: 22
        run: bash scripts/ios-visual-tests.sh "${{ matrix.device }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: split-ios-visual-${{ matrix.device }}-${{ github.sha }}
          path: ios/visual-artifacts/
          if-no-files-found: warn
      - name: Archive simulator app
        if: matrix.device == 'standard'
        run: ditto -c -k --keepParent ios/DerivedData/Build/Products/Debug-iphonesimulator/App.app Split-Simulator.zip
      - uses: actions/upload-artifact@v4
        if: matrix.device == 'standard'
        with:
          name: split-ios-simulator-${{ github.sha }}
          path: Split-Simulator.zip
          if-no-files-found: error
          retention-days: 14
